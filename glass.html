<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookmark">
<title>Bookmark</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif;
    background: #f2f2f7; color: #1c1c1e;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { background: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10;
           border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 20px; margin: 0; }
  button { font-size: 17px; padding: 12px 16px; border: none; border-radius: 12px;
           background: #007aff; color: #fff; min-height: 44px; }
  button.secondary { background: #e5e5ea; color: #1c1c1e; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  .box { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  input[type=url] { width: 100%; font-size: 17px; padding: 12px; border: 1px solid #ccc;
                    border-radius: 12px; margin-bottom: 10px; }
  /* タブ: iPhoneは4つずつ2行、iPadは1行(横スクロールなし) */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
  @media (min-width: 600px) { .tabs { grid-template-columns: repeat(7, 1fr); } }
  .tabs button { background: #fff; color: #007aff; white-space: nowrap; min-width: 0;
                 padding: 8px 2px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .tabs button.active { background: #007aff; color: #fff; }
  .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .card a { color: inherit; text-decoration: none; display: block; }
  .service { font-size: 13px; font-weight: bold; color: #007aff; }
  .url { font-size: 15px; word-break: break-all; margin: 6px 0; }
  .date { font-size: 13px; color: #8e8e93; }
  .msg { font-size: 15px; min-height: 22px; margin: 8px 0 0; }
  .ok { color: #248a3d; } .ng { color: #d70015; }
  .card button { margin: 8px 8px 0 0; font-size: 15px; min-height: 40px; }
  /* カードの操作ボタンを1行に並べる */
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .actions button { margin: 0; flex: 1 1 0; min-width: 0; padding: 8px 0; }
  .actions button.textBtn { flex: 1 1 0; padding: 8px 2px; font-size: 14px; white-space: nowrap; }
  .thumb, .badge { display: flex; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
                   border-radius: 12px; margin-bottom: 8px; background: #e5e5ea; }
  .badge { align-items: center; justify-content: center; color: #fff;
           font-size: 22px; font-weight: bold; }
  .badge-instagram { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }
  .badge-x { background: #000; }
  .badge-youtube { background: #ff0000; }
  .badge-note { background: #41c9b4; }
  .badge-other { background: #8e8e93; }
  #list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #list .card { margin-bottom: 0; }
  #list p { grid-column: 1 / -1; }
  @media (min-width: 768px) {
    #list { grid-template-columns: 1fr 1fr 1fr; }
  }
  /* 貼り付け欄と保存ボタンを横並び */
  .msg:empty { display: none; }
  .addRow { display: flex; gap: 8px; align-items: stretch; }
  .addRow input[type=url] { flex: 1 1 auto; min-width: 0; width: auto; margin: 0; }
  .addRow button { flex: 0 0 auto; white-space: nowrap; }
  /* タグ */
  .tagBar { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 14px; }
  .tagBar:empty { display: none; }
  .chip { font-size: 14px; padding: 6px 12px; min-height: 34px; border-radius: 17px;
          background: #fff; color: #3a3a3c; border: 1px solid #d1d1d6; }
  .chip.active { background: #3a3a3c; color: #fff; border-color: #3a3a3c; }
  .cardTags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tagLabel { font-size: 12px; padding: 2px 8px; border-radius: 8px;
              background: #e5e5ea; color: #3a3a3c; }
  .sheetBg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50;
             display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 16px 16px 0 0;
           padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
  .sheet h2 { font-size: 17px; margin: 0 0 12px; }
  .sheet .tagBar { margin: 0 0 12px; }
  .sheet .addRow input { font-size: 17px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 12px; flex: 1 1 auto; min-width: 0; }
  .sheetBtns { display: flex; gap: 8px; margin-top: 14px; }
  .sheetBtns button { flex: 1; }

  /* ===== Liquid Glass風の見本(glass.html だけ) ===== */
  :root {
    --glass: rgba(255,255,255,0.52);
    --glass-strong: rgba(255,255,255,0.72);
    --glass-edge: rgba(255,255,255,0.75);
    --glass-blur: blur(22px) saturate(180%);
    --ink: #1c1c1e;
    --ink-sub: #5b5b62;
  }
  body {
    color: var(--ink);
    background:
      radial-gradient(60% 45% at 10% 5%, #c9dcff 0%, transparent 70%),
      radial-gradient(55% 40% at 95% 25%, #f6d6ec 0%, transparent 70%),
      radial-gradient(60% 50% at 30% 85%, #d3f1e4 0%, transparent 70%),
      radial-gradient(50% 40% at 90% 95%, #fbe7c8 0%, transparent 70%),
      #eef0f6;
    background-attachment: fixed;
    min-height: 100vh;
  }
  header {
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--glass-edge);
    box-shadow: 0 6px 24px rgba(30,40,80,0.08);
  }
  .box, .card {
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-edge);
    border-radius: 24px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 28px rgba(30,40,80,0.10);
  }
  .thumb, .badge { border-radius: 16px; }
  button {
    border-radius: 999px;
    background: rgba(28,28,30,0.82);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 4px 14px rgba(0,0,0,0.12);
  }
  button.secondary, .card button.secondary {
    background: var(--glass-strong); color: var(--ink);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 2px 10px rgba(30,40,80,0.08);
  }
  input[type=url], .sheet .addRow input {
    background: rgba(255,255,255,0.6); border: 1px solid var(--glass-edge);
    border-radius: 999px; padding-left: 16px;
  }
  .tabs button {
    background: var(--glass); color: var(--ink);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .tabs button.active { background: rgba(28,28,30,0.82); color: #fff; border-color: transparent; }
  .chip {
    background: var(--glass); color: var(--ink); border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .chip.active { background: rgba(28,28,30,0.82); color: #fff; border-color: transparent; }
  .tagLabel { background: rgba(255,255,255,0.65); border: 1px solid var(--glass-edge); }
  .service { color: var(--ink-sub); }
  .date { color: var(--ink-sub); }
  .sheetBg { background: rgba(20,24,40,0.18); }
  .sheet {
    background: rgba(255,255,255,0.62);
    -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-edge); border-bottom: none;
    border-radius: 28px 28px 0 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 -10px 40px rgba(30,40,80,0.15);
  }
  .sheetBtns button[style] { background: rgba(28,28,30,0.82) !important; }
</style>
</head>
<body>
<header>
  <h1>Bookmark <span style="font-size:13px;color:#8e8e93;font-weight:normal">v0.25</span></h1>
  <button id="authBtn" class="secondary">ログイン</button>
</header>

<main>
  <section id="loggedOut" class="box">
    <p>Googleアカウントでログインすると、保存したリンクが見られます。</p>
    <button id="loginBtn">Googleでログイン</button>
    <p id="loginMsg" class="msg ng"></p>
  </section>

  <section id="loggedIn" style="display:none">
    <div class="box">
      <div class="addRow">
        <input id="urlInput" type="url" placeholder="URLを貼り付け">
        <button id="saveBtn">保存</button>
      </div>
      <p id="msg" class="msg"></p>
    </div>

    <p id="count" class="date" style="margin: 0 0 10px 4px;"></p>
    <div class="tabs" id="tabs"></div>
    <div class="tagBar" id="tagBar"></div>
    <div id="list"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, onSnapshot,
         serverTimestamp, limit, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ===== Firebaseの設定（前にコピーした値） =====
const firebaseConfig = {
  apiKey: "AIzaSyDWrc9WMz2GbzrSMPB_dvvnDHhYZaU5ghg",
  authDomain: "bookmark-1bf19.firebaseapp.com",
  projectId: "bookmark-1bf19",
  storageBucket: "bookmark-1bf19.firebasestorage.app",
  messagingSenderId: "230106425490",
  appId: "1:230106425490:web:6c8dd150329eded6709e4b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SERVICES = [
  { key: "all", label: "すべて" },
  { key: "instagram", label: "Instagram" },
  { key: "x", label: "X" },
  { key: "youtube", label: "YouTube" },
  { key: "note", label: "note" },
  { key: "other", label: "その他" },
  { key: "archive", label: "アーカイブ" }
];
const SERVICE_LABEL = Object.fromEntries(SERVICES.map(s => [s.key, s.label]));
let currentService = "all";
let currentTag = "";
const NO_TAG = "__none__"; // 「タグなし」で絞り込むときの印
let currentUser = null;
let unsubscribe = null;
let allItems = [];

// ===== URLの整理と分類 =====
function normalizeUrl(raw) {
  let u;
  try { u = new URL(raw.trim()); } catch { return null; }
  if (u.protocol !== "https:" && u.protocol !== "http:") return null;
  u.hash = "";
  // 投稿を特定しない「共有用のおまけ」だけを取り除く（投稿を見分けるパラメータは残す）
  const host = u.hostname.replace(/^www\./, "");
  let drop = [];
  if (host === "x.com" || host === "twitter.com") drop = ["s", "t"];
  else if (host === "instagram.com") drop = ["igsh", "igshid"];
  else if (host === "youtube.com" || host === "youtu.be") drop = ["si", "feature", "pp"];
  else if (host === "note.com") drop = ["sub_rt"];
  for (const k of [...u.searchParams.keys()]) {
    if (k.startsWith("utm_") || drop.includes(k)) u.searchParams.delete(k);
  }
  return u.toString().replace(/\/$/, "");
}

function detectService(url) {
  const host = new URL(url).hostname.replace(/^www\./, "");
  if (host === "instagram.com") return "instagram";
  if (host === "x.com" || host === "twitter.com") return "x";
  if (host === "youtube.com" || host === "youtu.be") return "youtube";
  if (host === "note.com") return "note";
  return "other";
}

function formatDate(ts) {
  if (!ts) return "保存中…";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("ja-JP", { dateStyle: "medium", timeStyle: "short" });
}

// ===== 共有メニュー（ショートカット）から渡されたURLを受け取る =====
// ?t=ページの名前&add=URL の形で受け取る（t は無くてもよい）
const shareMatch = location.search.match(/[?&]add=(.*)$/);
const sharedParam = shareMatch ? shareMatch[1] : null;
if (sharedParam) {
  sessionStorage.setItem("pendingAdd", sharedParam);
  const before = location.search.slice(0, shareMatch.index + 1);
  const tMatch = before.match(/[?&]t=([^&]*)/);
  const t = tMatch ? cleanTitle(tMatch[1]) : "";
  if (t) sessionStorage.setItem("pendingTitle", t);
  else sessionStorage.removeItem("pendingTitle");
  history.replaceState(null, "", location.pathname);
}

// ショートカットが取ってきたページの名前を整える
function cleanTitle(raw) {
  let t = raw || "";
  try { t = decodeURIComponent(t.replace(/\+/g, "%20")); } catch (e) {}
  // &amp; などの記号を元の文字に戻す
  const ta = document.createElement("textarea");
  ta.innerHTML = t;
  t = ta.value.replace(/\s+/g, " ").trim();
  // 末尾の「 - YouTube」「｜note」などを外す
  t = t.replace(/\s*[-|｜]\s*(YouTube|note)\s*$/i, "").trim();
  // サービス名だけ・ログイン画面などは名前として使わない
  if (/^(x|twitter|instagram|youtube|note|login|ログイン.*|.*Instagram.*ログイン.*)$/i.test(t)) return "";
  return t.slice(0, 100);
}

// ===== ログイン =====
document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    console.error(e);
    document.getElementById("loginMsg").textContent =
      "ログインできませんでした。エラー番号：" + (e.code || "不明") + "（v0.25）";
  }
};
document.getElementById("authBtn").onclick = () => {
  if (currentUser) signOut(auth);
};

onAuthStateChanged(auth, user => {
  currentUser = user;
  document.getElementById("loggedOut").style.display = user ? "none" : "block";
  document.getElementById("loggedIn").style.display = user ? "block" : "none";
  document.getElementById("authBtn").textContent = user ? "ログアウト" : "ログイン";
  if (user) {
    startListening();
    const pending = sessionStorage.getItem("pendingAdd");
    if (pending) {
      sessionStorage.removeItem("pendingAdd");
      const pendingTitle = sessionStorage.getItem("pendingTitle") || "";
      sessionStorage.removeItem("pendingTitle");
      document.getElementById("urlInput").value = pending;
      saveUrl(pendingTitle);
    }
  } else {
    stopListening();
  }
});

// ===== 保存 =====
document.getElementById("saveBtn").onclick = () => saveUrl("");

async function saveUrl(autoTitle) {
  const msg = document.getElementById("msg");
  const btn = document.getElementById("saveBtn");
  const url = normalizeUrl(document.getElementById("urlInput").value);
  if (!url) {
    msg.className = "msg ng";
    msg.textContent = "URLの形式が正しくありません。https://から始まるURLを貼ってください。";
    return;
  }
  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "保存中…";
  try {
    const bookmarks = collection(db, "users", currentUser.uid, "bookmarks");
    // 重複確認（アーカイブ済みも含む）
    const dup = await getDocs(query(bookmarks, where("normalizedUrl", "==", url), limit(1)));
    if (!dup.empty) {
      msg.className = "msg ng";
      msg.textContent = "このURLはすでに保存されています。";
    } else {
      await addDoc(bookmarks, {
        url: url,
        normalizedUrl: url,
        service: detectService(url),
        // YouTubeはショートカットの名前が当てにならないので、あとで自動取得する
        title: ["youtube", "x"].includes(detectService(url)) ? "" : (autoTitle || ""),
        accountName: "",
        excerpt: "",
        thumbnailUrl: "",
        savedAt: serverTimestamp(),
        isArchived: false,
        metadataStatus: "pending"
      });
      msg.className = "msg ok";
      msg.textContent = "保存しました。";
      document.getElementById("urlInput").value = "";
    }
  } catch (e) {
    console.error(e);
    msg.className = "msg ng";
    msg.textContent = "保存できませんでした。通信状態を確認して、もう一度お試しください。";
  } finally {
    btn.disabled = false;
  }
}

// ===== 一覧（リアルタイム同期） =====
function startListening() {
  stopListening();
  const q = collection(db, "users", currentUser.uid, "bookmarks");
  unsubscribe = onSnapshot(q, snap => {
    const millis = x => (x.savedAt && x.savedAt.toMillis) ? x.savedAt.toMillis() : Date.now();
    allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                        .sort((a, b) => millis(b) - millis(a));
    renderTabs();
    renderTagBar();
    renderList();
    fillYoutubeTitles();
    fillPageImages();
  }, err => {
    console.error(err);
    document.getElementById("list").textContent = "一覧を読み込めませんでした。";
  });
}

// ===== YouTubeの動画の名前を自動で取る =====
// 名前が空のYouTubeだけ、1件につき1回だけ取りに行く
const titleTried = new Set();
async function fetchYoutubeTitle(url) {
  const tries = [
    "https://noembed.com/embed?url=" + encodeURIComponent(url),
    "https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(url)
  ];
  for (const t of tries) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(t, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) continue;
      const data = await res.json();
      if (data && data.title) return String(data.title).slice(0, 100);
    } catch (e) { console.warn(e); }
  }
  return "";
}
// ===== Xの投稿の名前(投稿した人と本文の書き出し)を取る =====
function jsonp(url, ms) {
  return new Promise(resolve => {
    const cb = "_cb" + Date.now() + Math.floor(Math.random() * 1000);
    const sc = document.createElement("script");
    const done = v => { delete window[cb]; sc.remove(); clearTimeout(timer); resolve(v); };
    const timer = setTimeout(() => done(null), ms);
    window[cb] = data => done(data);
    sc.onerror = () => done(null);
    sc.src = url + "&callback=" + cb;
    document.head.appendChild(sc);
  });
}
function titleFromTweet(data) {
  if (!data) return "";
  let text = "";
  try {
    const d = new DOMParser().parseFromString(data.html || "", "text/html");
    const p = d.querySelector("blockquote p");
    text = p ? p.textContent.replace(/\s+/g, " ").replace(/https?:\/\/\S+/g, "").trim() : "";
  } catch (e) {}
  const name = data.author_name || "";
  if (!name && !text) return "";
  if (text.length > 60) text = text.slice(0, 60) + "…";
  return (name ? name + ":" : "") + (text || "(画像・動画の投稿)");
}
async function fetchXTitle(url) {
  const tw = url.replace(/^https?:\/\/(www\.|mobile\.)?x\.com\//, "https://twitter.com/");
  // 1. noembed 経由
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch("https://noembed.com/embed?url=" + encodeURIComponent(tw), { signal: ctrl.signal });
    clearTimeout(timer);
    if (res.ok) {
      const t = titleFromTweet(await res.json());
      if (t) return t;
    }
  } catch (e) { console.warn(e); }
  // 2. Xの公開の仕組みを直接
  const data = await jsonp("https://publish.twitter.com/oembed?omit_script=true&url=" + encodeURIComponent(tw), 8000);
  return titleFromTweet(data);
}

async function fillYoutubeTitles() {
  const targets = allItems.filter(i => (i.service === "youtube" || i.service === "x") && !i.title
    && i.metadataStatus !== "failed" && !titleTried.has(i.id));
  for (const item of targets) {
    titleTried.add(item.id);
    const title = item.service === "x" ? await fetchXTitle(item.url) : await fetchYoutubeTitle(item.url);
    try {
      await updateDoc(doc(db, "users", currentUser.uid, "bookmarks", item.id),
        title ? { title: title, metadataStatus: "done" } : { metadataStatus: "failed" });
    } catch (e) { console.warn(e); }
  }
}

// ===== noteとその他のサイトの画像(と名前)を Microlink で取る =====
// 登録なしで1日25回まで。1件につき1回だけ取りに行く
const imageTried = new Set();
async function fillPageImages() {
  const targets = allItems.filter(i => (i.service === "note" || i.service === "other")
    && !i.thumbnailUrl && !i.imageStatus && !imageTried.has(i.id));
  for (const item of targets) {
    imageTried.add(item.id);
    let data = null;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);
      const res = await fetch("https://api.microlink.io/?url=" + encodeURIComponent(item.url), { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.status === 429) return; // 今日の回数を使い切った → 明日また
      if (res.ok) data = (await res.json()).data;
    } catch (e) { console.warn(e); continue; } // 通信の失敗は、次に開いたときにもう一度
    const update = {};
    const img = data && data.image && data.image.url;
    if (img && /^https:\/\//.test(img)) { update.thumbnailUrl = img; update.imageStatus = "done"; }
    else update.imageStatus = "failed";
    if (!item.title && data && data.title) update.title = String(data.title).slice(0, 100);
    try {
      await updateDoc(doc(db, "users", currentUser.uid, "bookmarks", item.id), update);
    } catch (e) { console.warn(e); }
  }
}

function stopListening() {
  if (unsubscribe) unsubscribe();
  unsubscribe = null;
  allItems = [];
  document.getElementById("list").innerHTML = "";
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  SERVICES.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s.label;
    b.className = s.key === currentService ? "active" : "";
    b.onclick = () => { currentService = s.key; renderTabs(); renderList(); };
    tabs.appendChild(b);
  });
}

// ===== タグ =====
function allTags() {
  const set = new Set();
  allItems.forEach(i => (i.tags || []).forEach(t => set.add(t)));
  return [...set].sort((a, b) => a.localeCompare(b, "ja"));
}

function renderTagBar() {
  const bar = document.getElementById("tagBar");
  bar.innerHTML = "";
  const tags = allTags();
  if (currentTag && currentTag !== NO_TAG && !tags.includes(currentTag)) currentTag = "";
  if (tags.length === 0) return;
  ["", ...tags, NO_TAG].forEach(t => {
    const b = document.createElement("button");
    b.className = "chip" + (t === currentTag ? " active" : "");
    b.textContent = t === NO_TAG ? "タグなし" : (t ? "#" + t : "タグ：すべて");
    b.onclick = () => { currentTag = t; renderTagBar(); renderList(); };
    bar.appendChild(b);
  });
}

function openTagSheet(item) {
  const selected = new Set(item.tags || []);
  const bg = document.createElement("div");
  bg.className = "sheetBg";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  const h = document.createElement("h2");
  h.textContent = "タグを付ける";
  const chips = document.createElement("div");
  chips.className = "tagBar";
  const drawChips = () => {
    chips.innerHTML = "";
    const tags = [...new Set([...allTags(), ...selected])].sort((a, b) => a.localeCompare(b, "ja"));
    if (tags.length === 0) {
      const p = document.createElement("span");
      p.className = "date";
      p.textContent = "まだタグがありません。下で新しく作ってください。";
      chips.appendChild(p);
    }
    tags.forEach(t => {
      const b = document.createElement("button");
      b.className = "chip" + (selected.has(t) ? " active" : "");
      b.textContent = (selected.has(t) ? "✓ " : "") + t;
      // 候補のタグを押したら、その場で保存して閉じる
      b.onclick = () => { selected.has(t) ? selected.delete(t) : selected.add(t); drawChips(); save.onclick(); };
      chips.appendChild(b);
    });
  };
  drawChips();

  const row = document.createElement("div");
  row.className = "addRow";
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "新しいタグ（例：料理）";
  const addBtn = document.createElement("button");
  addBtn.className = "secondary";
  addBtn.textContent = "追加";
  const addTag = () => {
    const t = input.value.replace(/^#/, "").replace(/\s+/g, " ").trim().slice(0, 20);
    if (!t) return;
    selected.add(t);
    input.value = "";
    drawChips();
  };
  addBtn.onclick = addTag;
  input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addTag(); } };
  row.append(input, addBtn);

  const btns = document.createElement("div");
  btns.className = "sheetBtns";
  const cancel = document.createElement("button");
  cancel.className = "secondary";
  cancel.textContent = "キャンセル";
  cancel.onclick = () => bg.remove();
  const save = document.createElement("button");
  save.textContent = "保存";
  save.style.background = "#3a3a3c";
  save.onclick = async () => {
    if (input.value.trim()) addTag();
    try {
      await updateDoc(doc(db, "users", currentUser.uid, "bookmarks", item.id),
                      { tags: [...selected].sort((a, b) => a.localeCompare(b, "ja")) });
      bg.remove();
    } catch (e) {
      console.error(e);
      alert("タグを保存できませんでした。");
    }
  };
  btns.append(cancel, save);

  sheet.append(h, chips, row, btns);
  bg.appendChild(sheet);
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

function getYoutubeId(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, "");
    if (host === "youtu.be") return u.pathname.slice(1) || null;
    if (host === "youtube.com") {
      if (u.searchParams.get("v")) return u.searchParams.get("v");
      const m = u.pathname.match(/^\/(shorts|embed)\/([^/]+)/);
      if (m) return m[2];
    }
  } catch {}
  return null;
}

function makeBadge(service) {
  const b = document.createElement("div");
  b.className = "badge badge-" + (service || "other");
  b.textContent = SERVICE_LABEL[service] || "その他";
  return b;
}

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const activeCount = allItems.filter(i => i.isArchived !== true).length;
  const archivedCount = allItems.length - activeCount;
  document.getElementById("count").textContent =
    `保存件数：${activeCount}件（アーカイブ ${archivedCount}件）`;
  const showArchive = currentService === "archive";
  const items = allItems.filter(i => showArchive
    ? i.isArchived === true
    : (i.isArchived !== true && (currentService === "all" || i.service === currentService)))
    .filter(i => !currentTag
      || (currentTag === NO_TAG ? !(i.tags && i.tags.length) : (i.tags || []).includes(currentTag)));
  if (items.length === 0) {
    const p = document.createElement("p");
    p.textContent = currentTag === NO_TAG ? "タグなしのブックマークはありません。"
      : currentTag ? "このタグのブックマークはありません。" : "まだ保存されていません。";
    list.appendChild(p);
    return;
  }
  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    const a = document.createElement("a");
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener";

    const s = document.createElement("div");
    s.className = "service";
    s.textContent = SERVICE_LABEL[item.service] || "その他";

    const u = document.createElement("div");
    u.className = "url";
    u.textContent = item.title || item.url;

    const d = document.createElement("div");
    d.className = "date";
    d.textContent = "保存日：" + formatDate(item.savedAt);

    const ytId = getYoutubeId(item.url);
    const imgSrc = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`
      : (item.service !== "instagram" && item.service !== "x" && item.thumbnailUrl) || "";
    let thumb;
    if (imgSrc) {
      thumb = document.createElement("img");
      thumb.className = "thumb";
      thumb.alt = "";
      thumb.referrerPolicy = "no-referrer";
      thumb.src = imgSrc;
      thumb.onerror = () => thumb.replaceWith(makeBadge(item.service));
    } else {
      thumb = makeBadge(item.service);
    }
    a.append(thumb, s, u, d);
    card.appendChild(a);

    if (item.tags && item.tags.length) {
      const tg = document.createElement("div");
      tg.className = "cardTags";
      item.tags.forEach(t => {
        const l = document.createElement("span");
        l.className = "tagLabel";
        l.textContent = "#" + t;
        tg.appendChild(l);
      });
      card.appendChild(tg);
    }

    const rename = document.createElement("button");
    rename.className = "secondary";
    rename.textContent = "✏️";
    rename.title = "名前を付ける";
    rename.onclick = async () => {
      const name = prompt("この投稿の名前を入力してください", item.title || "");
      if (name === null) return;
      try {
        await updateDoc(doc(db, "users", currentUser.uid, "bookmarks", item.id),
                        { title: name.trim() });
      } catch (e) {
        console.error(e);
        alert("名前を保存できませんでした。");
      }
    };
    const actions = document.createElement("div");
    actions.className = "actions";
    actions.appendChild(rename);

    const tagBtn = document.createElement("button");
    tagBtn.className = "secondary";
    tagBtn.textContent = "🏷️";
    tagBtn.title = "タグを付ける";
    tagBtn.onclick = () => openTagSheet(item);
    actions.appendChild(tagBtn);

    const setArchive = async (flag) => {
      try {
        await updateDoc(doc(db, "users", currentUser.uid, "bookmarks", item.id), { isArchived: flag });
      } catch (e) {
        console.error(e);
        alert("操作できませんでした。");
      }
    };

    if (!item.isArchived) {
      const arc = document.createElement("button");
      arc.className = "secondary";
      arc.textContent = "📦";
      arc.title = "アーカイブする";
      arc.onclick = () => setArchive(true);
      actions.appendChild(arc);
    } else {
      const back = document.createElement("button");
      back.className = "secondary";
      back.textContent = "元に戻す";
      back.onclick = () => setArchive(false);
      const del = document.createElement("button");
      del.textContent = "完全に削除";
      del.style.background = "#d70015";
      del.onclick = async () => {
        if (!confirm("完全に削除します。元に戻せません。よろしいですか？")) return;
        try {
          await deleteDoc(doc(db, "users", currentUser.uid, "bookmarks", item.id));
        } catch (e) {
          console.error(e);
          alert("削除できませんでした。");
        }
      };
      back.classList.add("textBtn");
      del.className = "textBtn";
      // アーカイブは文字のボタンが長いので、2行目に分ける
      const actions2 = document.createElement("div");
      actions2.className = "actions";
      actions2.append(back, del);
      card.appendChild(actions);
      card.appendChild(actions2);
    }
    if (!card.contains(actions)) card.appendChild(actions);
    list.appendChild(card);
  });
}
</script>
